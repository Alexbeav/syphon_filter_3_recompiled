# SF3 Redux Phase 1 presentation/input defaults. Copy beside the generated
# executable as settings.toml. Every option is reversible and retail state is
# still advanced by the original SCUS-94640 code.
[video]
renderer = "opengl"
supersampling = 4
window_width = 1280
antialiasing = true
texture_filtering = "nearest"
fullscreen = 1
aspect_ratio = "4:3"
frame_interpolation = false

[launcher]
skip_launcher = true

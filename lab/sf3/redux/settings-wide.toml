# SF3 Redux native-wide acceptance profile. The same generated executable can
# be returned to settings-4x.toml for a 4:3 compatibility A/B.
[video]
renderer = "opengl"
supersampling = 4
window_width = 1920
antialiasing = true
texture_filtering = "nearest"
fullscreen = 1
aspect_ratio = "16:9"
frame_interpolation = false

[launcher]
skip_launcher = true

[controller]
mouse_camera = true
mouse_chase_yaw_sensitivity = 1.0
mouse_chase_pitch_sensitivity = 1.0
mouse_aim_yaw_sensitivity = 1.0
mouse_aim_pitch_sensitivity = 1.0
mouse_invert_y = false

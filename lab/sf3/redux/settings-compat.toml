# SF3 Redux compatibility profile. Copy beside the generated executable as
# settings.toml. The verified SCUS-94640 camera hook remains generated, but
# the host adapter is disabled at runtime for a clean retail-state A/B.
[video]
renderer = "opengl"
supersampling = 1
window_width = 1280
antialiasing = false
texture_filtering = "nearest"
fullscreen = 0
aspect_ratio = "4:3"
frame_interpolation = false

[launcher]
skip_launcher = true

[controller]
mouse_camera = false
